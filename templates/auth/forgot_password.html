{% extends "base.html" %}

{% block title %}Mot de passe oublie - Unissons la Main{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">
                        <i class="fas fa-key"></i> Mot de passe oublie
                    </h2>


                    <p class="text-muted text-center mb-3">
                        Entrez votre nom d'utilisateur et choisissez un nouveau mot de passe.
                    </p>

                    <form method="POST" action="/auth/reset-password">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Nom utilisateur" required>
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label">Nouveau mot de passe</label>
                            <input type="password" class="form-control form-control-lg" id="new_password" name="new_password" placeholder="Nouveau mot de passe" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirmer mot de passe</label>
                            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="Confirmer mot de passe" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="fas fa-key"></i> Réinitialiser le mot de passe
                        </button>
                    </form>

                    <hr>

                    <p class="text-center text-muted mb-0">
                        Vous avez deja un code?
                        <a href="/auth/reset-password" class="fw-bold">Reinitialiser maintenant</a>
                    </p>
                    <p class="text-center text-muted mt-2 mb-0">
                        <a href="/auth/login" class="fw-bold">Retour a la connexion</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
